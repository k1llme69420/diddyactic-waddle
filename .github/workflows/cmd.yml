name: Run Windows CMD Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'The Windows CMD command to run'
        required: true
        default: 'dir'
        type: string

jobs:
  run-command:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Command and Send to Summary
        shell: cmd
        run: |
          ${{ inputs.command }} > output.tmp 2>&1
          type output.tmp
          
          echo ```cmd >> %GITHUB_STEP_SUMMARY%
          type output.tmp >> %GITHUB_STEP_SUMMARY%
          echo ``` >> %GITHUB_STEP_SUMMARY%
