name: Run Windows CMD Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'The Windows CMD command to run'
        required: true
        default: 'echo example'
        type: string

jobs:
  run-command:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run CMD Command
        shell: cmd
        run: ${{ inputs.command }}
