name: Command Prompt

on:
  workflow_dispatch:
    inputs:
      commands:
        description: 'Enter Command Prompt commands (separated by semicolons)'
        required: true
        default: 'ver; dir'
        type: string

jobs:
  run-batch:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Commands via CMD and Write Summary
        shell: pwsh
        run: |
          $commands = "${{ inputs.commands }}" -split ";"

          foreach ($cmd in $commands) {
              $trimmed = $cmd.Trim()
              if ([string]::IsNullOrWhiteSpace($trimmed)) { continue }

              "### `$trimmed`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              '```bat' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

              $pinfo = New-Object System.Diagnostics.ProcessStartInfo
              $pinfo.FileName = "cmd.exe"
              $pinfo.Arguments = "/c $trimmed 2>&1"
              $pinfo.RedirectStandardOutput = $true$pinfo.RedirectStandardError = $true$pinfo.UseShellExecute = $false$pinfo.CreateNoWindow = $true$p = New-Object System.Diagnostics.Process
              $p.StartInfo =$pinfo
              [void]$p.Start()
              $output =$p.StandardOutput.ReadToEnd() + $p.StandardError.ReadToEnd()$p.WaitForExit()
              $exitCode =$p.ExitCode

              if ($output) {
                  $output.TrimEnd() \vert{} Out-File -FilePath$env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              }
              
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

              if ($exitCode -ne 0) {
                  exit $exitCode
              }
          }
