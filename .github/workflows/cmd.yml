name: Command Prompt

on:
  workflow_dispatch:
    inputs:
      commands:
        description: 'Enter Command Prompt commands (separated by semicolons)'
        required: true
        default: 'ver; dir'
        type: string

jobs:
  run-batch:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Commands
        shell: pwsh
        run: |
          $rawCommands = "${{ inputs.commands }}"
          if ([string]::IsNullOrWhiteSpace($rawCommands)) {
              Write-Error "No commands provided."
              exit 1
          }

          $commands = $rawCommands -split ";"
          
          foreach ($cmd in $commands) {
              $trimmed = $cmd.Trim()
              if ([string]::IsNullOrWhiteSpace($trimmed)) { continue }
              
              # Write command header to summary
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### `$trimmed`"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```bat'
              
              # Execute strictly through cmd.exe, capturing stdout and stderr
              $output = cmd.exe /c "$trimmed 2>&1"
              $exitCode =$LASTEXITCODE

              if ($null -ne$output) {
                  foreach ($line in$output) {
                      Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value$line
                  }
              } else {
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "(no output)"
              }
              
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
              
              # Handle exit status and stop execution if a command fails
              if ($exitCode -ne 0) {
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "> ❌ **Status:** Failed with exit code `$exitCode`"
                  exit $exitCode
              } else {
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "> ✅ **Status:** Success"
              }
          }
