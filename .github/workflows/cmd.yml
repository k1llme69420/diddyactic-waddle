name: Run Custom Commands

on:
  workflow_dispatch:
    inputs:
      commands:
        description: 'Enter commands (one per line)'
        required: true
        default: |
          node -v
          dir
        type: string

jobs:
  run-batch:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Commands and Write Summary
        shell: pwsh
        run: |
          $commands = "${{ inputs.commands }}" -split "`r?`n"

          foreach ($cmd in $commands) {
              $trimmed = $cmd.Trim()
              if ([string]::IsNullOrWhiteSpace($trimmed) -or $trimmed.StartsWith("#")) { continue }

              "### `$trimmed`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              '```powershell' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

              $output = Invoke-Expression$trimmed 2>&1 | Out-String
              $exitCode =$LASTEXITCODE

              if ($output) {
                  $output.TrimEnd() \vert{} Out-File -FilePath$env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              }
              
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

              if ($exitCode -ne 0) {
                  exit $exitCode
              }
          }
