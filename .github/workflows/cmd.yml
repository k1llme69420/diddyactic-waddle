name: Command Prompt

on:
  workflow_dispatch:
    inputs:
      commands:
        description: 'Enter Command Prompt commands (separated by semicolons)'
        required: true
        default: 'ver; dir'
        type: string

jobs:
  run-batch:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Commands
        shell: pwsh
        run: |
          $commands = "${{ inputs.commands }}" -split ";"
          foreach ($cmd in $commands) {
              $trimmed = $cmd.Trim()
              if (-not $trimmed) { continue }
              
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### $trimmed"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```bat'
              
              $output = cmd.exe /c$trimmed 2>&1
              if ($output) {
                  Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value$output
              }
              
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
              
              if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }
          }
