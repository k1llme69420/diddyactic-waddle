name: Run Windows CMD Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'The Windows CMD command to run'
        required: true
        default: 'dir'
        type: string

jobs:
  run-command:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Command and Send to Summary
        shell: powershell
        run: |
          cmd.exe /c "${{ inputs.command }}" 2>&1 | Out-File -FilePath output.tmp -Encoding utf8
          
          Get-Content output.tmp

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```cmd'
          Get-Content output.tmp | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
