name: Command Prompt

on:
  workflow_dispatch:
    inputs:
      commands:
        description: 'Enter Command Prompt commands (separated by semicolons)'
        required: true
        default: 'ver; dir'
        type: string

jobs:
  run-batch:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Commands
        shell: pwsh
        run: |
          $commands = "${{ inputs.commands }}" -split ";"
          
          foreach ($cmd in $commands) {
              $trimmed = $cmd.Trim()
              if ([string]::IsNullOrWhiteSpace($trimmed)) { continue }

              "### `$trimmed`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              '```bat' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

              $output = cmd.exe /c$trimmed 2>&1
              if ($output) {
                  $output \vert{} Out-File -FilePath$env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              }
              
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

              if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }
          }
