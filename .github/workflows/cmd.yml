name: Run Custom Commands

on:
  workflow_dispatch:
    inputs:
      commands:
        description: 'Enter commands to run (one per line)'
        required: true
        default: |
          ver
          whoami
        type: string

jobs:
  run-batch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/run-commands
        with:
          commands: ${{ inputs.commands }}
