name: Command Prompt

on:
  workflow_dispatch:
    inputs:
      commands:
        description: 'Enter Command Prompt commands (separated by semicolons)'
        required: true
        default: 'ver; dir'
        type: string

jobs:
  run-batch:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Commands
        shell: pwsh
        run: |
          $rawCommands = "${{ inputs.commands }}"

          if ([string]::IsNullOrWhiteSpace($rawCommands)) {
          	Write-Error "No commands provided."
          	exit 1
          }
          
          $commands = $rawCommands -split ";"
          
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```bat'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'runner> starting execution...'
          
          foreach ($cmd in $commands)
          {
          	$trimmed = $cmd.Trim()
          
          	if ([string]::IsNullOrWhiteSpace($trimmed)) { continue }
          
          	Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "runner> now running: `"$trimmed`"`n"
          
          	$output = cmd.exe /c "$trimmed 2>&1"
          	$exitCode = $LASTEXITCODE
          
          	if ($null -ne $output) 
          	{
          		foreach ($line in $output) 
          		{
          			Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $line
          		}
          	} 
          	else 
          	{
          		Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "(no output)"
          	}
          	
          	if ($exitCode -eq 0)
          	{
          		Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "`nrunner> successfully finished execution"
          	}
          	else
          	{
          		Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "`nrunner> failed with exit code $exitCode"
          	}
          	
          	if ($exitCode -ne 0) 
          	{
          		exit $exitCode
          	}
          }

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "runner> finished running all commands!"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
