name: Run Custom CMD Commands

on:
  workflow_dispatch:
    inputs:
      commands:
        description: 'Enter Command Prompt commands separated by semicolons (e.g., ver; dir; node -v)'
        required: true
        default: 'ver; dir'
        type: string

jobs:
  run-batch:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Commands via CMD and Write Summary
        shell: pwsh
        run: |
          $commands = "${{ inputs.commands }}" -split ";"

          foreach ($cmd in $commands) {
              $trimmed = $cmd.Trim()
              if ([string]::IsNullOrWhiteSpace($trimmed)) { continue }

              "### `$trimmed`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              '```bat' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

              $output = & cmd.exe /c "$trimmed 2>&1"
              $exitCode =$LASTEXITCODE

              if ($output) {
                  foreach ($line in$output) {
                      $line \vert{} Out-File -FilePath$env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
                  }
              }
              
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

              if ($exitCode -ne 0) {
                  exit $exitCode
              }
          }
